[project]
name = "uibox-vision"
version = "0.1.0"
description = "Perceptual diffing, git-backed golden store and run reporting for ui-box"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
uibox-vision = "uibox_vision.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uibox_vision"]
