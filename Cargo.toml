[workspace]
resolver = "2"
members = ["crates/ui-box", "crates/ui-box-core", "crates/ui-box-mcp", "crates/ui-box-pipeline"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

[profile.release]
lto = "thin"
strip = true
